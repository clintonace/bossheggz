# SeggzApp — production stack for Hostinger VPS → Docker Manager → Compose.
#
# Self-contained: no other repository files are needed. Paste this file as the project's
# YAML and paste your filled-in settings (see .env.hostinger.example) into "Environment".
# Ports 80 and 443 must be free on the VPS; point APP_DOMAIN and PMA_DOMAIN at its IP first.
#
# After the first deploy, create your admin (VPS terminal):
#   docker exec -it bossheggz-app-1 php artisan db:seed --force          (uses ADMIN_EMAIL / ADMIN_PASSWORD)
#   or: docker exec -it bossheggz-app-1 php artisan app:make-admin you@yourdomain.com

x-app: &app
  image: ${APP_IMAGE:-clintonace09/bossheggz:prod}
  restart: unless-stopped
  environment: &app-environment
    APP_NAME: ${APP_NAME:-BOSSHEGZ Realty}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set APP_KEY}
    APP_DEBUG: "false"
    APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    APP_MAINTENANCE_DRIVER: file
    BCRYPT_ROUNDS: 12
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-seggzapp}
    DB_USERNAME: ${DB_USERNAME:-seggzapp}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    SESSION_DRIVER: redis
    SESSION_LIFETIME: 120
    SESSION_SECURE_COOKIE: "true"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: log
    FILESYSTEM_DISK: local
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
    MAIL_FROM_NAME: ${APP_NAME:-BOSSHEGZ Realty}
    LISTING_CURRENCY: ${LISTING_CURRENCY:-₦}
    COMPANY_NAME: ${COMPANY_NAME:-BOSSHEGZ Realty}
    COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-BOSSHEGZ Realty Ltd}
    COMPANY_TAGLINE: ${COMPANY_TAGLINE:-Strategic Property. Lasting Wealth.}
    COMPANY_PHONE: ${COMPANY_PHONE:-}
    COMPANY_WHATSAPP: ${COMPANY_WHATSAPP:-}
    COMPANY_EMAIL: ${COMPANY_EMAIL:-}
    COMPANY_INSTAGRAM: ${COMPANY_INSTAGRAM:-}
    COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
    ADMIN_NAME: ${ADMIN_NAME:-Site Admin}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    SEED_DEMO_DATA: "false"
    DEV_ACCOUNT_SWITCHER: "false"
    AUTORUN_ENABLED: "false"
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      # On start: storage link, migrations and config/route/view caching.
      AUTORUN_ENABLED: "true"

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-seggzapp}
      MYSQL_USER: ${DB_USERNAME:-seggzapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://${PMA_DOMAIN:?Set PMA_DOMAIN}/
      UPLOAD_LIMIT: 128M
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - phpmyadmin

  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      DB_DATABASE: ${DB_DATABASE:-seggzapp}
      DB_USERNAME: ${DB_USERNAME:-seggzapp}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Nightly database dump + uploads archive into ./backups next to this project on the VPS.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          if mysqldump -h db -u "$$DB_USERNAME" --single-transaction --quick --routines --no-tablespaces "$$DB_DATABASE" | gzip > "/backups/db-$$stamp.sql.gz.tmp"; then
            mv "/backups/db-$$stamp.sql.gz.tmp" "/backups/db-$$stamp.sql.gz" && echo "[backup] database saved: db-$$stamp.sql.gz"
          else
            rm -f "/backups/db-$$stamp.sql.gz.tmp"; echo "[backup] database dump FAILED" >&2
          fi
          if [ -d /storage/app/public ]; then
            tar -czf "/backups/uploads-$$stamp.tar.gz" -C /storage/app public && echo "[backup] uploads saved: uploads-$$stamp.tar.gz"
          fi
          find /backups -type f \( -name 'db-*.sql.gz' -o -name 'uploads-*.tar.gz' \) -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - ./backups:/backups
      - storage:/storage:ro
    depends_on:
      db:
        condition: service_healthy

configs:
  caddyfile:
    # HTTPS for both domains is automatic (Let's Encrypt). phpMyAdmin sits behind an extra login.
    content: |
      {
        email ${ACME_EMAIL:?Set ACME_EMAIL}
      }

      ${APP_DOMAIN} {
        encode zstd gzip
        reverse_proxy app:8080
      }

      ${PMA_DOMAIN} {
        encode zstd gzip
        basic_auth {
          ${PMA_AUTH_USER:?Set PMA_AUTH_USER} ${PMA_AUTH_HASH:?Set PMA_AUTH_HASH}
        }
        reverse_proxy phpmyadmin:80
      }

volumes:
  storage:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
